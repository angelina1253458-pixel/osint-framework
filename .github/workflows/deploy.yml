name: Deploy OSINT Framework

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream OSINT Framework
        uses: actions/checkout@v4
        with:
          repository: lockfale/OSINT-Framework
          ref: master
          path: source

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/public

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
